version: "3.8"

# Sistema de Gestion de Usuarios y Roles - DSY2207 Semana 3
# Levanta: BFF (Spring Boot) + 8 funciones serverless (Java/Azure Functions) + Oracle
#
# Este compose es el entorno de DESARROLLO/DEMO local que reproduce en un solo host
# la arquitectura multicloud acordada en el diagrama del equipo (ARQ-USUARIOS-ROLES):
#   - bff-service   -> en el diagrama corre en AWS (EC2 + Docker). La misma imagen
#                      Docker de este servicio es la que se sube a la instancia EC2.
#   - function-*    -> representan las Azure Functions (Agregar/Listar/Modificar/
#                      Eliminar, x2). Para el despliegue real se publican con
#                      `func azure functionapp publish` o el plugin de Maven.
#   - oracle-db     -> aqui se usa Oracle XE local solo para desarrollar y probar
#                      rapido. En el diagrama la base real es Oracle OCI: para
#                      apuntar a ella basta con cambiar ORACLE_DB_URL/USER/PASSWORD
#                      de las funciones por los datos de conexion (wallet) de OCI.
#
# IMPORTANTE (Docker Lab / EC2): al subir este compose al Docker Lab o a EC2, las
# URLs internas (http://function-usuarios:80, http://function-roles:80) siguen
# funcionando porque los contenedores se resuelven por nombre de servicio dentro
# de la misma red de Docker. Si el entorno expone las funciones con otra URL/puerto
# hacia afuera, solo hay que actualizar FUNCION_USUARIOS_URL / FUNCION_ROLES_URL
# del servicio bff-service, sin tocar ni recompilar ningun codigo.

services:

  oracle-db:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: oracle-db
    environment:
      ORACLE_PWD: CAMBIAR_PASSWORD
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./db/script_oracle.sql:/opt/oracle/scripts/startup/script_oracle.sql
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'select 1 from dual;' | sqlplus -s system/CAMBIAR_PASSWORD@//localhost:1521/XEPDB1"]
      interval: 30s
      timeout: 10s
      retries: 10

  function-usuarios:
    build:
      context: ./function-usuarios
    container_name: function-usuarios
    depends_on:
      - oracle-db
    environment:
      ORACLE_DB_URL: "jdbc:oracle:thin:@//oracle-db:1521/XEPDB1"
      ORACLE_DB_USER: "dsy2207"
      ORACLE_DB_PASSWORD: "CAMBIAR_PASSWORD"
    ports:
      - "7071:80"

  function-roles:
    build:
      context: ./function-roles
    container_name: function-roles
    depends_on:
      - oracle-db
    environment:
      ORACLE_DB_URL: "jdbc:oracle:thin:@//oracle-db:1521/XEPDB1"
      ORACLE_DB_USER: "dsy2207"
      ORACLE_DB_PASSWORD: "CAMBIAR_PASSWORD"
    ports:
      - "7072:80"

  bff-service:
    build:
      context: ./bff-service
    container_name: bff-service
    depends_on:
      - function-usuarios
      - function-roles
    environment:
      FUNCION_USUARIOS_URL: "http://function-usuarios:80/api"
      FUNCION_ROLES_URL: "http://function-roles:80/api"
    ports:
      - "8080:8080"

volumes:
  oracle-data:
